function groupByCity(li) {
  var g = {};
  for(var i=0;i<li.length;i++) {
    var ct = li[i].city;
    if(!g[ct]) g[ct] = [];
    g[ct].push(li[i]);
  }
  return g;
}

function groupByRegion(li) {
  var g = {};
  for(var i=0;i<li.length;i++) {
    var r = li[i].region;
    if(!g[r]) g[r] = [];
    g[r].push(li[i]);
  }
  return g;
}

var regionOrder = ["中国","泰国","日本","新加坡","越南","巴厘岛","悉尼","巴黎","马德里"];

function render(list) {
  var app = document.getElementById("list");
  var html = "";
  if(list === h || list.length === h.length) {
    var hot = ["曼谷嘉佩乐酒店","新加坡嘉佩乐酒店","巴厘岛乌布山姣四季酒店"];
    var hh = [];
    for(var i=0;i<hot.length;i++) {
      for(var j=0;j<h.length;j++) { if(h[j].n === hot[i]) { hh.push(h[j]); break; } }
    }
    if(hh.length > 0) {
      html += '<div class="hotb"><div class="hott">🔥 热门推荐</div><div class="hotg">';
      for(var i=0;i<hh.length;i++) {
        html += '<div class="hti" onclick="goHotel(this)" data-name="' + hh[i].n + '">' + hh[i].n + '</div>';
      }
      html += '</div></div>';
    }
  }

  var grouped = groupByRegion(list);
  for(var ri=0;ri<regionOrder.length;ri++) {
    var region = regionOrder[ri];
    if(!grouped[region]) continue;
    html += '<div class="rg" id="rg_' + region + '">';
    html += '<div class="rth" onclick="tR(this)">' + region + ' <span class="ar">▼</span></div>';
    html += '<div class="rb">';
    var byCity = groupByCity(grouped[region]);
    var cNames = Object.keys(byCity).sort();
    for(var ci=0;ci<cNames.length;ci++) {
      var ct = cNames[ci];
      html += '<div class="cth" onclick="tC(this)">' + ct + ' <span>' + byCity[ct].length + ' ▼</span></div>';
      html += '<div class="cb">';
      for(var hi=0;hi<byCity[ct].length;hi++) {
        var x = byCity[ct][hi];
        html += '<div class="hc"><div class="ht" onclick="tog(this)">';
        html += '<div class="hn">';
        // logo removed for consistency
        html += '<span><span class="hn-text">' + x.n + '</span>';
        if(x.en) html += '<span class="hn-en">' + x.en + '</span>';
        html += '</span></div><span class="ht-icon">+</span></div>';
        html += '<div class="hb"><span class="tg">' + x.tag + '</span>';
        if(x.save) html += '<div class="sv">' + x.save + '</div>';
        html += '<a class="mp" href="https://www.google.com/maps/search/' + encodeURIComponent(x.n + " " + x.city) + '" target="_blank">📍 在地图上查看</a>';
        html += '<div class="pc">促销政策 (' + x.p.length + '项)</div>';
        if(x.p.length === 0) {
          html += '<div style="color:#ddd;font-size:11px;">暂无促销信息</div>';
        } else {
          for(var pi=0;pi<x.p.length;pi++) {
            var ps = x.p[pi].split(" | ");
            html += '<div class="pr">' + ps[0] + (ps[1] ? '<em>' + ps[1] + '</em>' : '') + '</div>';
          }
        }
        html += '</div></div>';
      }
      html += '</div>';
    }
    html += '</div></div>';
  }

  app.innerHTML = html;
  document.getElementById("empty").style.display = list.length === 0 ? "block" : "none";
}

function tR(el) {
  var arrow = el.querySelector(".ar");
  var body = el.nextElementSibling;
  if(body) body.classList.toggle("on");
  if(arrow) arrow.classList.toggle("on");
}

function tC(el) {
  var body = el.nextElementSibling;
  if(body) body.classList.toggle("on");
}

function tog(el) {
  var b = el.nextElementSibling;
  if(b && b.classList) b.classList.toggle("on");
}

function sR(region) {
  var el = document.getElementById("rg_" + region);
  if(el) {
    el.scrollIntoView({behavior:"smooth"});
    var body = el.querySelector(".rb");
    if(body) body.classList.add("on");
    var arrow = el.querySelector(".ar");
    if(arrow) arrow.classList.add("on");
  }
}

function goHotel(el) {
  var name = el.getAttribute("data-name");
  var hNames = document.querySelectorAll(".hn-text");
  for(var i=0;i<hNames.length;i++) {
    if(hNames[i].textContent === name) {
      var hotelHeader = hNames[i].closest(".ht");
      if(!hotelHeader) continue;
      var hotelCard = hotelHeader.closest(".hc");
      if(!hotelCard) continue;
      var cityBody = hotelCard.closest(".cb");
      var regionBody = hotelCard.closest(".rb");
      var hotelBody = hotelCard.querySelector(".hb");
      var cityHeader = cityBody ? cityBody.previousElementSibling : null;
      if(regionBody) regionBody.classList.add("on");
      if(cityBody) cityBody.classList.add("on");
      if(hotelBody) hotelBody.classList.add("on");
      hotelCard.scrollIntoView({behavior:"smooth",block:"center"});
      break;
    }
  }
}
